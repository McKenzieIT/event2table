# 手动评分配置文件
# 用于覆盖自动评分，调整特定文档的评分和标签
#
# 格式说明：
# - filename: 文件名（不含路径）
#   score: 评分（1-3星）
#   tags: 标签列表
#   override: 是否覆盖自动评分（true/false）
#   reason: 调整原因（可选）
#
# 评分标准：
#   ⭐⭐⭐ (3星) = 核心文档，必读
#   ⭐⭐ (2星) = 重要参考
#   ⭐ (1星) = 补充材料
#
# 常用标签：
#   #核心 - 必读文档
#   #参考 - 重要参考
#   #补充 - 补充材料
#   #GraphQL, #测试, #缓存 - 主题标签

# ========================================
# GraphQL 迁移文档
# ========================================

# 自动评分正确，无需调整
GRAPHQL_MIGRATION_SUMMARY.md:
  score: 3
  tags: ["核心", "完整方案", "GraphQL"]
  override: false

# ========================================
# E2E 测试文档
# ========================================

# 示例：提升评分（如果文件名是QUICK但内容完整）
# E2E-TEST-QUICK-REFERENCE.md:
#   score: 3  # 从自动2星提升到3星
#   tags: ["核心", "测试参考", "测试"]
#   override: true
#   reason: "虽然文件名是QUICK，但内容是完整的测试参考指南"

# ========================================
# 缓存失效修复文档
# ========================================

# 自动评分正确
CACHE_INVALIDATION_FINAL_REPORT.md:
  score: 3
  tags: ["核心", "完整方案", "缓存"]
  override: false

# ========================================
# 临时文档降级示例
# ========================================

# 示例：降低评分（临时测试文档）
# TEMP-TEST.md:
#   score: 1  # 从自动2星降到1星
#   tags: ["补充"]
#   override: true
#   reason: "临时测试文档，参考价值有限"

# ========================================
# 使用说明
# ========================================
#
# 1. 默认情况下，所有文档使用自动评分
# 2. 如需调整评分，取消注释相关配置
# 3. 设置 override: true 表示手动覆盖
# 4. 运行 python3 scripts/tools/generate_topic_index.py 重新生成索引
#
# 如何确定哪些文档需要手动调整？
# - 运行脚本后，查看生成的评分统计
# - 检查 ⭐⭐⭐ 核心文档列表（目标：约20%）
# - 如果明显是核心文档但被评2星，提升到3星
# - 如果是临时文档但被评2星，降到1星
#

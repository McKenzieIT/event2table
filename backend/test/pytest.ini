[pytest]
# Test discovery
testpaths = .
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test* *Tests

# Environment variables for testing
env =
    FLASK_ENV = testing

# Coverage options
addopts =
    --cov=../api
    --cov=../core
    --cov=../models
    --cov-report=html:output/coverage
    -v
    --tb=short
    # 并行测试配置（CI环境）
    -n auto
    --dist loadscope
    --maxfail=5

# Warning filters
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    ignore:FLASK_SECRET_KEY not set:UserWarning

# Custom markers
markers =
    integration: Integration tests (tests that cross boundaries)
    api: API endpoint tests
    unit: Unit tests (fast, isolated tests)
    slow: Slow-running tests
    database: Database-related tests

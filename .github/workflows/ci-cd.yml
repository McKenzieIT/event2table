name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, opt/ci-cd]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run backend unit tests
        run: |
          source backend/venv/bin/activate
          pytest backend/tests/unit/ -v --cov=backend --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=70

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=70

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend-unit
          name: backend-unit-coverage
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: htmlcov/
          retention-days: 30

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:unit -- --coverage --coverage.threshold.lines=70 --coverage.threshold.functions=70 --coverage.threshold.branches=70 --coverage.threshold.statements=70 --reporter=json --reporter=text

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend-unit
          name: frontend-unit-coverage
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 30

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-unit-tests]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Initialize test database
        run: |
          python scripts/setup/init_db.py
        env:
          DATABASE_URL: sqlite:///data/test_database.db

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Verify frontend build
        run: |
          cd frontend
          if [ ! -d "dist" ]; then
            echo "❌ Frontend build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Frontend build failed: index.html not found"
            exit 1
          fi
          echo "✅ Frontend build successful"
          ls -lh dist/

      - name: Start backend server
        run: |
          python web_app.py &
          sleep 10
        env:
          FLASK_ENV: testing
          DATABASE_URL: sqlite:///data/test_database.db

      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright install --with-deps
          npm run test:e2e
        env:
          CI: true

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 30

      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: frontend/test-results/**/*.png
          retention-days: 30

  lighthouse:
    name: Lighthouse Performance Tests
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Run Lighthouse CI
        run: |
          cd frontend
          npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'frontend/.lighthouseci/lhr-report.json';
            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const categories = results.categories;
              const comment = `## Lighthouse CI Results

              | Category | Score |
              |----------|-------|
              | Performance | ${Math.round(categories.performance.score * 100)}% |
              | Accessibility | ${Math.round(categories.accessibility.score * 100)}% |
              | Best Practices | ${Math.round(categories['best-practices'].score * 100)}% |
              | SEO | ${Math.round(categories.seo.score * 100)}% |
              | PWA | ${Math.round(categories.pwa.score * 100)}% |

              [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pylint black mypy

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Python linting (Black)
        run: |
          black --check backend/

      - name: Run Python type checking (MyPy)
        run: |
          mypy backend/ --ignore-missing-imports --strict
        continue-on-error: true

      - name: Run Python linting (Pylint)
        run: |
          pylint backend/ --fail-under=8.0 --output-format=colorized
        continue-on-error: true

      - name: Run Python flake8
        run: |
          pip install flake8
          flake8 backend/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint -- --max-warnings=0

      - name: Run TypeScript type check
        run: |
          cd frontend
          npm run type-check

      - name: Run Prettier check
        run: |
          cd frontend
          npx prettier --check "src/**/*.{ts,tsx,json,css,md}"

      - name: Upload code quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            .mypy_cache/
            pylint-report.txt
          retention-days: 7

  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-unit-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run API contract tests
        run: |
          python test/ci_cd/test_ci_cd_workflow.py

      - name: Upload API contract test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-test-results
          path: output/api_contract_*.md
          retention-days: 30

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-unit-tests, e2e-tests, lighthouse, code-quality, api-contract-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://event2table.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd frontend && npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Create deployment backup
        run: |
          ./scripts/deploy.sh backup
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy application
        run: |
          ./scripts/deploy.sh deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Health check
        run: |
          ./scripts/deploy.sh health-check
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      - name: Run smoke tests
        run: |
          cd frontend
          npm run test:e2e:smoke
        env:
          BASE_URL: https://event2table.example.com

      - name: Rollback on failure
        if: failure()
        run: |
          ./scripts/deploy.sh rollback
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to production: ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}